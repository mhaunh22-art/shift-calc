<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شغل فور يو - التوظيف بدون رسوم</title>
    <!-- استدعاء خط كايرو الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0b1d3a; /* كحلي فاخر */
            --accent-color: #d4af37;  /* ذهبي مميز */
            --bg-color: #f4f6f9;
            --text-color: #333333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-top: 5px solid var(--accent-color);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-area h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
        }
        .logo-area p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #122c54;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--accent-color);
            font-weight: 600;
        }
        #success-msg {
            display: none;
            text-align: center;
            margin-top: 15px;
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>شغل فور يو</h1>
            <p>سجل بياناتك معنا لتجد الوظيفة المناسبة (بدون أي رسوم)</p>
        </div>

        <form id="jobForm">
            <div class="form-group">
                <label for="الاسم">الاسم الكامل:</label>
                <input type="text" id="الاسم" name="الاسم" required placeholder="اكتب اسمك الثلاثي">
            </div>

            <div class="form-group">
                <label for="الموبايل">رقم الموبايل:</label>
                <input type="tel" id="الموبايل" name="الموبايل" required placeholder="مثال: 01012345678">
            </div>

            <div class="form-group">
                <label for="رقم الوتس">رقم الواتساب:</label>
                <input type="tel" id="رقم الوتس" name="رقم الوتس" required placeholder="مثال: 01012345678">
            </div>

            <div class="form-group">
                <label for="المؤهل">المؤهل الدراسي:</label>
                <select id="المؤهل" name="المؤهل" required>
                    <option value="">اختر المؤهل الدراسي</option>
                    <option value="بدون مؤهل / يقرأ ويحكتب">بدون مؤهل / يقرأ ويكتب</option>
                    <option value="مؤهل متوسط (دبلوم صناعة/تجارة/زراعة)">مؤهل متوسط (دبلوم صناعة/تجارة/زراعة)</option>
                    <option value="مؤهل فوق المتوسط">مؤهل فوق المتوسط</option>
                    <option value="مؤهل عالي (خريج جامعة)">مؤهل عالي (خريج جامعة)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="سنوات_الخبرة">سنوات الخبرة:</label>
                <select id="سنوات_الخبرة" name="سنوات_الخبرة" required>
                    <option value="">اختر خبرتك</option>
                    <option value="بدون خبرة (حديث التخرج)">بدون خبرة (حديث التخرج)</option>
                    <option value="من سنة إلى سنتين">من سنة إلى سنتين</option>
                    <option value="من 3 إلى 5 سنوات">من 3 إلى 5 سنوات</option>
                    <option value="أكثر من 5 سنوات (محترف)">أكثر من 5 سنوات (محترف)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="الكورسات">كورسات أو دورات تدريبية (إن وجدت):</label>
                <input type="text" id="الكورسات" name="الكورسات" placeholder="مثال: كورس لغة، كمبيوتر، أمان صناعي...">
            </div>

            <div class="form-group">
                <label for="المرتب_المتوقع">المرتب المتوقع (بالجنيه):</label>
                <input type="number" id="المرتب_المتوقع" name="المرتب_المتوقع" placeholder="مثال: 6000">
            </div>

            <button type="submit" id="submitBtn">تسجيل البيانات</button>
            
            <div id="loading">جاري إرسال بياناتك، لطفا الانتظار...</div>
            <div id="success-msg">تم إرسال بياناتك بنجاح يا فنان! سنتواصل معك قريبًا.</div>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx4HwNsnim3i6E428FNR7WszE7wTwxpQhfROCIGr0QVw0lQ5MuQjfsTNIFMEqRATwogiA/exec';
        const form = document.getElementById('jobForm');
        const loading = document.getElementById('loading');
        const successMsg = document.getElementById('success-msg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.style.display = 'none';
            loading.style.display = 'block';

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    loading.style.display = 'none';
                    successMsg.style.display = 'block';
                    form.reset();
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                        submitBtn.style.display = 'block';
                    }, 5000);
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('حدث خطأ أثناء الإرسال، برجاء المحاولة مرة أخرى.');
                    loading.style.display = 'none';
                    submitBtn.style.display = 'block';
                });
        });
    </script>

</body>
</html>
