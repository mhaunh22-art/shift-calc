<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شغل فور يو - حاسبة الأجور وتسجيل الوظائف</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 2px solid #d4af37; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2, h3 { text-align: center; color: #d4af37; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; background: #d4af37; color: #0f172a; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b89728; }
        .result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 6px; border: 1px dashed #d4af37; text-align: center; }
        .divider { margin: 30px 0; border: 0; border-top: 1px solid #475569; }
        .note { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>شغل فور يو 🛡️</h2>
    <h3>حاسبة أجور عمال المصانع</h3>
    
    <label>المرتب الأساسي (أو الأجر الشهري):</label>
    <input type="number" id="basicSalary" placeholder="مثال: 5000">

    <label>عدد ساعات الإضافي:</label>
    <input type="number" id="overtimeHours" placeholder="عدد الساعات الإضافية">

    <label>نوع الشيفت:</label>
    <select id="shiftType">
        <option value="day">شيفت نهاري (عادي)</option>
        <option value="night">شيفت ليلي (بنسبة إضافي)</option>
    </select>

    <label>الخصومات أو الجزاءات:</label>
    <input type="number" id="deductions" placeholder="قيمة الجزاءات أو الغياب" value="0">

    <button onclick="calculateSalary()">احسب صافي المرتب الآن</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>نتيجة الحساب:</h3>
        <p id="finalResultText"></p>
    </div>

    <hr class="divider">

    <!-- قسم تسجيل بيانات الباحثين عن عمل -->
    <h3>تسجيل للبحث عن وظيفة (بدون رسوم)</h3>
    <form action="https://formspree.io/f/your-form-id" method="POST" onsubmit="alert('تم تسجيل بياناتك بنجاح، سنتواصل معك فور توفر فرصة عمل مناسبة!');">
        <label>الاسم بالكامل:</label>
        <input type="text" name="name" required placeholder="اكتب اسمك هنا">

        <label>رقم الواتساب للتواصل:</label>
        <input type="tel" name="phone" required placeholder="01xxxxxxxx">

        <label>المحافظة / المدينة:</label>
        <input type="text" name="city" required placeholder="مثال: القليوبية، العاشر من رمضان">

        <label>التخصص أو المهنة المطلوبة:</label>
        <input type="text" name="job" required placeholder="مثال: عامل إنتاج، فني، أمن">

        <button type="submit" style="background: #22c55e; color: #fff;">سجل بياناتك للحصول على عمل</button>
        <p class="note">جميع خدماتنا وفرص العمل مجانية 100% وبدون أي رسوم.</p>
    </form>
</div>

<script>
    function calculateSalary() {
        let basic = parseFloat(document.getElementById('basicSalary').value) || 0;
        let otHours = parseFloat(document.getElementById('overtimeHours').value) || 0;
        let shift = document.getElementById('shiftType').value;
        let deductions = parseFloat(document.getElementById('deductions').value) || 0;

        let hourlyRate = (basic / 30) / 8; 
        let otTotal = otHours * hourlyRate * 1.35; 
        
        if(shift === 'night') {
            otTotal *= 1.15; 
        }

        let netSalary = (basic + otTotal) - deductions;

        let resultBox = document.getElementById('resultBox');
        let text = document.getElementById('finalResultText');
        
        resultBox.style.display='block';
        text.innerHTML = `إجمالي الاستحقاق التقريبي: <b>${netSalary.toFixed(2)} ج.م</b> <br><small>(شامل الإضافي والشيفت والخصومات)</small>`;
    }
</script>

</body>
</html>
