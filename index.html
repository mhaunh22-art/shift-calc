<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المرتبات والشفتات - شغل فور يو</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* لافتة التوظيف */
        .cta-banner {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .cta-banner h2 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
        }

        .cta-banner p {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .cta-btn {
            display: inline-block;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .cta-btn:hover {
            background-color: #059669;
        }

        /* الحاسبة */
        h1 {
            font-size: 1.3rem;
            text-align: center;
            color: #0f172a;
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button.calc-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .results {
            margin-top: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .result-row.total {
            border-top: 2px solid #cbd5e1;
            padding-top: 8px;
            font-weight: bold;
            color: #0f172a;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- بنر شغل فور يو للتوظيف -->
    <div class="cta-banner">
        <h2>تبحث عن فرصة عمل جديدة؟</h2>
        <p>سجل بياناتك الآن في شركة شغل فور يو لنساعدك في إيجاد الوظيفة المناسبة مجاناً!</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScP_FORM_ID_HERE/viewform" target="_blank" class="cta-btn">سجل بياناتك الآن</a>
    </div>

    <h1>حاسبة المرتبات والشفتات</h1>

    <div class="input-group">
        <label>المرتب الأساسي (جنيه):</label>
        <input type="number" id="baseSalary" placeholder="مثال: 4000">
    </div>

    <div class="input-group">
        <label>عدد أيام العمل الشهرية:</label>
        <input type="number" id="workDays" value="26">
    </div>

    <div class="input-group">
        <label>ساعات الشفت اليومي:</label>
        <select id="shiftHours">
            <option value="8">8 ساعات</option>
            <option value="12">12 ساعة</option>
        </select>
    </div>

    <div class="input-group">
        <label>ساعات الإضافي (Overtime):</label>
        <input type="number" id="overtimeHours" value="0">
    </div>

    <div class="input-group">
        <label>أيام الغياب / الجزاءات:</label>
        <input type="number" id="deductionDays" value="0">
    </div>

    <button class="calc-btn" onclick="calculateSalary()">حساب صافي المرتب</button>

    <div class="results" id="resultsBlock">
        <div class="result-row">
            <span>أجر اليوم:</span>
            <span id="dailyRate">0 جنيه</span>
        </div>
        <div class="result-row">
            <span>أجر الساعة:</span>
            <span id="hourlyRate">0 جنيه</span>
        </div>
        <div class="result-row">
            <span>قيمة الإضافي:</span>
            <span id="overtimePay">0 جنيه</span>
        </div>
        <div class="result-row">
            <span>إجمالي الاستقطاعات:</span>
            <span id="totalDeductions">0 جنيه</span>
        </div>
        <div class="result-row total">
            <span>صافي المرتب المتوقع:</span>
            <span id="netSalary">0 جنيه</span>
        </div>
    </div>
</div>

<script>
    function calculateSalary() {
        const base = parseFloat(document.getElementById('baseSalary').value) || 0;
        const days = parseFloat(document.getElementById('workDays').value) || 26;
        const shift = parseFloat(document.getElementById('shiftHours').value) || 8;
        const overtime = parseFloat(document.getElementById('overtimeHours').value) || 0;
        const deductions = parseFloat(document.getElementById('deductionDays').value) || 0;

        if (base <= 0) {
            alert('برجاء إدخال المرتب الأساسي');
            return;
        }

        const daily = base / days;
        const hourly = daily / shift;
        
        // حساب الإضافي بحاسبة 1.35 لساعات النهار
        const overtimeVal = overtime * hourly * 1.35;
        const deductionsVal = deductions * daily;
        
        const net = base + overtimeVal - deductionsVal;

        document.getElementById('dailyRate').innerText = daily.toFixed(2) + ' جنيه';
        document.getElementById('hourlyRate').innerText = hourly.toFixed(2) + ' جنيه';
        document.getElementById('overtimePay').innerText = overtimeVal.toFixed(2) + ' جنيه';
        document.getElementById('totalDeductions').innerText = deductionsVal.toFixed(2) + ' جنيه';
        document.getElementById('netSalary').innerText = net.toFixed(2) + ' جنيه';

        document.getElementById('resultsBlock').style.display = 'block';
    }
</script>

</body>
</html>
