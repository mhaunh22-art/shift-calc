<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شغل فور يو - حاسبة الأجور وتسجيل الوظائف</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 2px solid #d4af37; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2, h3 { text-align: center; color: #d4af37; margin-bottom: 15px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background: #d4af37; color: #0f172a; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #b89728; }
        .result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 6px; border: 1px dashed #d4af37; text-align: center; font-size: 16px; }
        .divider { margin: 30px 0; border: 0; border-top: 1px solid #475569; }
        .note { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 10px; }
        .badge { background: #22c55e; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
        
        /* تنسيق أزرار الاختيار الحديثة للخدمات */
        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
        .feature-option { position: relative; cursor: pointer; }
        .feature-option input { position: absolute; opacity: 0; cursor: pointer; }
        .feature-box { display: block; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; text-align: center; font-size: 13px; color: #cbd5e1; transition: all 0.2s ease; user-select: none; }
        .feature-option input:checked ~ .feature-box { background: rgba(212, 175, 55, 0.15); border-color: #d4af37; color: #d4af37; font-weight: bold; box-shadow: 0 0 8px rgba(212,175,55,0.2); }
        .feature-box:hover { border-color: #94a3b8; }
        
        @media (max-width: 480px) {
            .features-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>شغل فور يو 🛡️</h2>
    <h3>حاسبة أجور عمال المصانع</h3>
    
    <!-- قسم الحاسبة -->
    <div>
        <label for="basicSalary">المرتب الأساسي (أو الأجر الشهري):</label>
        <input type="number" id="basicSalary" placeholder="مثال: 5000">

        <label for="overtimeHours">عدد ساعات الإضافي:</label>
        <input type="number" id="overtimeHours" placeholder="عدد ساعات الإضافي">

        <label for="shiftType">نوع الشفت:</label>
        <select id="shiftType">
            <option value="normal">شفت نهاري (عادي)</option>
            <option value="night">شفت ليلي</option>
            <option value="alternating">شفت متناوب (أسبوع وأسبوع)</option>
        </select>

        <label for="deductions">الخصومات أو الجزاءات:</label>
        <input type="number" id="deductions" value="0">

        <button onclick="calculateSalary()">احسب صافي المرتب الآن</button>

        <div id="salaryResult" class="result" style="display:none;"></div>
    </div>

    <hr class="divider">

    <!-- قسم الفورم والتسجيل التفصيلي -->
    <div>
        <div style="text-align: center;">
            <span class="badge">بدون أي رسوم</span>
        </div>
        <h3>استمارة التسجيل الكاملة للبحث عن عمل</h3>
        <p class="note">املأ جميع بياناتك واختياراتك بدقة لكي يتم توجيهك للوظيفة المناسبة.</p>

        <form action="#" method="POST" onsubmit="alert('تم إرسال استمارتك بنجاح وسيتم التواصل معك قريباً!'); return false;">
            <label for="fullName">الاسم الكامل:</label>
            <input type="text" id="fullName" placeholder="اكتب اسمك ثلاثي هنا" required>

            <label for="phone">رقم الهاتف الأساسي:</label>
            <input type="tel" id="phone" placeholder="01xxxxxxxx" required>

            <label for="whatsapp">رقم الواتساب للتواصل:</label>
            <input type="tel" id="whatsapp" placeholder="01xxxxxxxx (إن أمكن)" required>

            <label for="governorate">المحافظة / المدينة / المنطقة:</label>
            <input type="text" id="governorate" placeholder="مثال: القليوبية، شبرا الخيمة، العاشر من رمضان" required>

            <label for="jobCategory">المجال أو التخصص المطلوب:</label>
            <select id="jobCategory" required>
                <option value="">اختر المجال المناسب...</option>
                <option value="press">عامل مكبس / تشكيل معادن أو بلاستيك</option>
                <option value="packaging">عامل تغليف، تعبئة وفرز</option>
                <option value="production_line">عامل خط إنتاج عام</option>
                <option value="cnc">عامل CNC / تشغيل ماكينات حديثة</option>
                <option value="forklift">سائق كلارك (معدات ثقيلة ومخازن)</option>
                <option value="driver">سائق (رخصة مهنية أولى وثانية وثالثة)</option>
                <option value="security">أمن وحراسة (بشفتات أو إقامة)</option>
                <option value="tech_mech">فني ميكانيكا / صيانة خطوط</option>
                <option value="tech_elect">فني كهرباء / كنترول</option>
                <option value="welder">لحام / برشام / تركيبات</option>
                <option value="warehouse">عامل مخازن / أمين عهدة / تحميل</option>
                <option value="quality">عامل مراقبة جودة (فحص)</option>
                <option value="sales">مبيعات وخدمة عملاء</option>
                <option value="other">مجال آخر يحدد لاحقاً</option>
            </select>

            <label for="licenseStatus">هل لديك رخصة؟ (للسائقين والفنيين):</label>
            <select id="licenseStatus">
                <option value="none">لا توجد رخصة / غير مخصص</option>
                <option value="forklift_license">رخصة قيادة كلارك معتمدة</option>
                <option value="professional_1">رخصة قيادة مهنية (درجة أولى)</option>
                <option value="professional_2">رخصة قيادة مهنية (درجة ثانية)</option>
                <option value="professional_3">رخصة قيادة مهنية (درجة ثالثة)</option>
                <option value="private">رخصة قيادة خاصة</option>
            </select>

            <label for="experience">سنوات الخبرة:</label>
            <select id="experience">
                <option value="less_than_1">أقل من سنة / مبتدئ (بدون خبرة سابقة)</option>
                <option value="1-2">من سنة إلى سنتين</option>
.                <option value="3-5">من 3 إلى 5 سنوات</option>
                <option value="more">أكثر من 5 سنوات (خبير ومحترف)</option>
            </select>

            <label for="shiftPreference">نظام الشفتات المفضل:</label>
            <select id="shiftPreference">
                <option value="morning">شفت صباحي فقط</option>
                <option value="night">شفت مسائي / ليلي فقط</option>
                <option value="alternating">شفتات متناوبة (ليلي ونهاري)</option>
                <option value="overtime_yes">أوافق على العمل الإضافي</option>
                <option value="any">أي نظام متاح</option>
            </select>

            <label>المميزات والخدمات المطلوبة:</label>
            <div class="features-grid">
                <label class="feature-option">
                    <input type="checkbox">
                    <span class="feature-box">🏠 سكن للمغتربين</span>
                </label>
                <label class="feature-option">
                    <input type="checkbox">
                    <span class="feature-box">🚌 مواصلات / بدل انتقال</span>
                </label>
                <label class="feature-option">
                    <input type="checkbox">
                    <span class="feature-box">🍲 وجبات / بدل طعام</span>
                </label>
                <label class="feature-option">
                    <input type="checkbox">
                    <span class="feature-box">🛡️ تأمين اجتماعي وصحي</span>
                </label>
            </div>

            <label for="notes" style="margin-top: 15px;">ملاحظات إضافية (اختياري):</label>
            <textarea id="notes" rows="3" placeholder="اكتب أي تفاصيل أخرى أو خبرات سابقة ترغب في توضيحها..."></textarea>

            <button type="submit" style="background: #22c55e; color: #fff;">إرسال الاستمارة الكاملة الآن</button>
        </form>
    </div>

    <p class="note" style="margin-top: 25px;">جميع خدماتنا وفرص العمل مجانية 100% وبدون أي رسوم.</p>
</div>

<script>
    function calculateSalary() {
        let basic = parseFloat(document.getElementById('basicSalary').value) || 0;
        let overtime = parseFloat(document.getElementById('overtimeHours').value) || 0;
        let deductions = parseFloat(document.getElementById('deductions').value) || 0;
        
        let hourRate = basic / 26 / 8; 
        let overtimeTotal = overtime * hourRate * 1.35;
        let net = basic + overtimeTotal - deductions;

        let resDiv = document.getElementById('salaryResult');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `صافي المرتب المتوقع: <strong>${net.toFixed(2)} جنيه</strong><br><small style="color: #94a3b8;">(شامل الإضافي ومخصوم منه الجزاءات)</small>`;
    }
</script>

</body>
</html>
